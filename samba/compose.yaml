# samba/compose.yaml
services:
  samba:
    image: ghcr.io/servercontainers/samba:latest
    container_name: samba
    restart: unless-stopped
    env_file:
      - ${PROJECT_ROOT}/samba/volumes/config/samba.env
    environment:
      MODEL: ${HOMELAB_HOSTNAME:-homelab}
      AVAHI_DISABLE: "true"
      WSDD2_DISABLE: "true"
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      HOMELAB_DEFAULT_QUOTA_GB: ${HOMELAB_DEFAULT_QUOTA_GB:-50}
      SAMBA_CONF_WORKGROUP: WORKGROUP
      SAMBA_CONF_SERVER_STRING: Homelab NAS
      SAMBA_CONF_LOG_LEVEL: "1"
      SAMBA_CONF_SMB3_DIRECTORY_LEASES: "no"
      SAMBA_CONF_DFREE_COMMAND: /dfree.sh
      # Private per-user home: \\server\username → storage/users/<username>
      SAMBA_VOLUME_CONFIG_homes: >-
        [homes];
        path=/shares/users/%U;
        comment=Private User Storage;
        valid users=%S;
        browseable=no;
        read only=no;
        writable=yes;
        force user=homelab;
        force group=homelab;
        create mask=0700;
        directory mask=0700;
        hide unreadable=yes;
        root preexec=/bin/mkdir -p /shares/users/%U;
        dfree command=/dfree.sh
      # Shared by all Samba users: \\server\shared → storage/shared
      SAMBA_VOLUME_CONFIG_shared: >-
        [shared];
        path=/shares/shared;
        comment=Shared Storage;
        browseable=yes;
        read only=no;
        writable=yes;
        force user=homelab;
        force group=homelab;
        create mask=0664;
        directory mask=0775;
        force create mode=0664;
        force directory mode=0775
    volumes:
      - ${PROJECT_ROOT}/storage:/shares
      - ${PROJECT_ROOT}/samba/volumes/data:/var/lib/samba
      - ${PROJECT_ROOT}/samba/entrypoint.sh:/entrypoint-homelab.sh:ro
      - ${PROJECT_ROOT}/samba/dfree.sh:/dfree.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint-homelab.sh"]
    command: ["runsvdir", "-P", "/container/config/runit"]
    ports:
      - "${SAMBA_HOST_PORT:-445}:445"
    networks:
      - homelab-net

networks:
  homelab-net:
    external: true
