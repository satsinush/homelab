# vaultwarden/compose.yaml
services:
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - ${PROJECT_ROOT}/services/vaultwarden/volumes/data:/data
      # System roots + Homelab CA (written by vaultwarden/setup.py) so OIDC works
      # when Authentik is served with Let's Encrypt *or* the private CA.
      - ${PROJECT_ROOT}/services/vaultwarden/volumes/config/ca-bundle.crt:/etc/ssl/certs/ca-bundle.crt:ro
    extra_hosts:
      - "${AUTHENTIK_SERVICE_NAME}.${HOMELAB_HOSTNAME}:${TRAEFIK_IP_ADDRESS}"
    networks:
      - homelab-net
    environment:
      - SSL_CERT_FILE=/etc/ssl/certs/ca-bundle.crt
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=false
      - DOMAIN=https://${VAULTWARDEN_SERVICE_NAME}.${HOMELAB_HOSTNAME}
      - SMTP_SSL_CA_CERT=/etc/ssl/certs/ca-bundle.crt
      # Canonical mail hostname (Docker network alias → Stalwart, TLS verified)
      - SMTP_HOST=${MAIL_SERVICE_NAME:-mail}.${HOMELAB_HOSTNAME}
      - SMTP_PORT=465
      - SMTP_SECURITY=force_tls
      - SMTP_USERNAME=vaultwarden@${HOMELAB_HOSTNAME}
      - SMTP_PASSWORD_FILE=/run/secrets/stalwart_smtp_vaultwarden_password
      - SMTP_FROM=vaultwarden@${HOMELAB_HOSTNAME}
      - SSO_ENABLED=true
      - SSO_CLIENT_ID=vaultwarden
      - SSO_AUTHORITY=https://${AUTHENTIK_SERVICE_NAME}.${HOMELAB_HOSTNAME}/application/o/vaultwarden/
      - SSO_SCOPES=openid email profile offline_access groups
      - SSO_AUTH_ONLY_NOT_SESSION=true
      - SSO_CLIENT_SECRET_FILE=/run/secrets/vaultwarden_oidc_secret
      - ADMIN_TOKEN_FILE=/run/secrets/vaultwarden_admin_token
    secrets:
      - vaultwarden_oidc_secret
      - vaultwarden_admin_token
      - stalwart_smtp_vaultwarden_password
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`${VAULTWARDEN_SERVICE_NAME}.${HOMELAB_HOSTNAME}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls=true"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
    depends_on:
      alerts:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:80/alive" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m

secrets:
  vaultwarden_oidc_secret:
    file: ${PROJECT_ROOT}/volumes/secrets/vaultwarden_oidc_secret
  vaultwarden_admin_token:
    file: ${PROJECT_ROOT}/volumes/secrets/vaultwarden_admin_token
  stalwart_smtp_vaultwarden_password:
    file: ${PROJECT_ROOT}/volumes/secrets/stalwart_smtp_vaultwarden_password

networks:
  homelab-net:
    external: true
