# gotify/compose.yaml
services:
  gotify:
    image: docker.io/gotify/server:latest
    container_name: gotify
    restart: unless-stopped
    volumes:
      - ${PROJECT_ROOT}/services/gotify/volumes/data:/app/data
      - ${PROJECT_ROOT}/services/gotify/homelab-icon.png:/app/icons/homelab.png:ro
      - ${PROJECT_ROOT}/services/dashboard/frontend/src/assets/gatus_logo.png:/app/icons/gatus.png:ro
      - ${PROJECT_ROOT}/services/dashboard/frontend/src/assets/dockhand_logo.png:/app/icons/dockhand.png:ro
      - ${PROJECT_ROOT}/services/dashboard/frontend/src/assets/vaultwarden_logo.png:/app/icons/vaultwarden.png:ro
      - ${PROJECT_ROOT}/services/dashboard/frontend/src/assets/stalwart_logo.png:/app/icons/stalwart.png:ro
      - ${PROJECT_ROOT}/services/dashboard/frontend/src/assets/immich_logo.png:/app/icons/immich.png:ro
      - ${PROJECT_ROOT}/services/dashboard/frontend/src/assets/nextcloud_logo.png:/app/icons/nextcloud.png:ro
      - ${PROJECT_ROOT}/services/dashboard/frontend/src/assets/authentik_logo.png:/app/icons/authentik.png:ro
      - ${PROJECT_ROOT}/services/dashboard/frontend/src/assets/rustdesk_logo.png:/app/icons/rustdesk.png:ro
      - ${PROJECT_ROOT}/services/dashboard/frontend/src/assets/gotify_logo.png:/app/icons/gotify.png:ro
      - ${PROJECT_ROOT}/services/dashboard/frontend/src/assets/pi_hole_logo.png:/app/icons/pihole.png:ro
    environment:
      - GOTIFY_SERVER_PORT=80
      - TZ=${TZ}
    networks:
      - homelab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gotify.rule=Host(`${GOTIFY_SERVICE_NAME}.${HOMELAB_HOSTNAME}`)"
      - "traefik.http.routers.gotify.entrypoints=websecure"
      - "traefik.http.routers.gotify.tls=true"
      - "traefik.http.routers.gotify.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.services.gotify.loadbalancer.server.port=80"

networks:
  homelab-net:
    external: true
