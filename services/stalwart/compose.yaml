services:
  stalwart:
    image: stalwartlabs/stalwart:latest
    container_name: stalwart
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint-homelab.sh"]
    command: ["--config", "/etc/stalwart/config.json"]
    volumes:
      - ${PROJECT_ROOT}/services/stalwart/volumes/config:/etc/stalwart
      - ${PROJECT_ROOT}/services/stalwart/volumes/data:/var/lib/stalwart
      # Shared PEMs: Homelab private (setup) or Let's Encrypt (traefik-certs-dumper).
      - ${PROJECT_ROOT}/volumes/certificates/stalwart-tls:/etc/stalwart/certs:ro
      - ${PROJECT_ROOT}/services/stalwart/entrypoint.sh:/entrypoint-homelab.sh:ro
    expose:
      - "25"
      - "465"
      - "993"
      - "8080"
    # IMAPS / SMTPS for Thunderbird and other clients (LAN + VPN; not MX/25).
    ports:
      - "${STALWART_IMAPS_HOST_PORT:-993}:993"
      - "${STALWART_SMTPS_HOST_PORT:-465}:465"
    networks:
      homelab-net:
        # Canonical mail hostname resolves on the Docker network (no hairpin).
        aliases:
          - ${MAIL_SERVICE_NAME:-mail}.${HOMELAB_HOSTNAME}
    environment:
      # Traefik terminates HTTPS for the optional administration interface.
      STALWART_PUBLIC_URL: https://${MAIL_SERVICE_NAME:-mail}.${HOMELAB_HOSTNAME}
    secrets:
      - stalwart_admin_password
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.stalwart.rule=Host(`${MAIL_SERVICE_NAME:-mail}.${HOMELAB_HOSTNAME}`)"
      - "traefik.http.routers.stalwart.entrypoints=websecure"
      - "traefik.http.routers.stalwart.tls=true"
      - "traefik.http.routers.stalwart.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.services.stalwart.loadbalancer.server.port=8080"

  # Mozilla / Nextcloud Mail ISPDB autoconfig (IMAP/SMTP host discovery).
  mail-autoconfig:
    image: nginx:alpine
    container_name: mail-autoconfig
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      HOMELAB_HOSTNAME: ${HOMELAB_HOSTNAME}
      MAIL_SERVICE_NAME: ${MAIL_SERVICE_NAME:-mail}
    volumes:
      - ${PROJECT_ROOT}/services/stalwart/autoconfig/entrypoint.sh:/entrypoint.sh:ro
      - ${PROJECT_ROOT}/services/stalwart/autoconfig/config-v1.1.xml.template:/template/config-v1.1.xml:ro
      - ${PROJECT_ROOT}/services/stalwart/autoconfig/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - homelab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.services.mail-autoconfig.loadbalancer.server.port=80"
      # Primary: https://autoconfig.<domain>/mail/config-v1.1.xml
      - "traefik.http.routers.mail-autoconfig.rule=Host(`autoconfig.${HOMELAB_HOSTNAME}`) && PathPrefix(`/mail`)"
      - "traefik.http.routers.mail-autoconfig.entrypoints=websecure"
      - "traefik.http.routers.mail-autoconfig.tls=true"
      - "traefik.http.routers.mail-autoconfig.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.mail-autoconfig.priority=50"
      # Fallback: https://<domain>/.well-known/autoconfig/mail/config-v1.1.xml
      # (priority beats dashboard apex redirect)
      - "traefik.http.routers.mail-autoconfig-wellknown.rule=Host(`${HOMELAB_HOSTNAME}`) && PathPrefix(`/.well-known/autoconfig/mail`)"
      - "traefik.http.routers.mail-autoconfig-wellknown.entrypoints=websecure"
      - "traefik.http.routers.mail-autoconfig-wellknown.tls=true"
      - "traefik.http.routers.mail-autoconfig-wellknown.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.mail-autoconfig-wellknown.priority=100"
      - "traefik.http.routers.mail-autoconfig-wellknown.service=mail-autoconfig"

secrets:
  stalwart_admin_password:
    file: ${PROJECT_ROOT}/volumes/secrets/stalwart_admin_password

networks:
  homelab-net:
    external: true
    name: homelab-net
