# Immich — pinned to v3 (VectorChord Postgres + Valkey). See Immich upgrade docs
# before changing IMMICH_VERSION; major bumps may require a DB engine reset.
services:
  immich-server:
    image: ghcr.io/immich-app/immich-server:${IMMICH_VERSION:-v3}
    container_name: immich-server
    restart: unless-stopped
    environment:
      DB_HOSTNAME: immich-postgres
      DB_USERNAME: immich
      DB_DATABASE_NAME: immich
      DB_PASSWORD_FILE: /run/secrets/immich_db_password
      REDIS_HOSTNAME: immich-redis
      IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning:3003
      TZ: ${TZ}
      # Trust Homelab CA for Authentik OIDC (additive; public CAs still work).
      NODE_EXTRA_CA_CERTS: /etc/ssl/certs/homelab-ca.crt
    extra_hosts:
      - "${AUTHENTIK_SERVICE_NAME}.${HOMELAB_HOSTNAME}:${TRAEFIK_IP_ADDRESS}"
    volumes:
      # Immich v2+ media root inside the container is /data (not /usr/src/app/upload).
      - ${PROJECT_ROOT}/services/immich/volumes/upload:/data
      - ${PROJECT_ROOT}/volumes/certificates/homelab-ca.crt:/etc/ssl/certs/homelab-ca.crt:ro
      - /etc/localtime:/etc/localtime:ro
    secrets:
      - immich_db_password
    networks:
      - homelab-net
    depends_on:
      immich-redis:
        condition: service_healthy
      immich-postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.immich.rule=Host(`${IMMICH_SERVICE_NAME:-photos}.${HOMELAB_HOSTNAME}`)"
      - "traefik.http.routers.immich.entrypoints=websecure"
      - "traefik.http.routers.immich.tls=true"
      - "traefik.http.routers.immich.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.services.immich.loadbalancer.server.port=2283"
    healthcheck:
      disable: false

  immich-machine-learning:
    image: ghcr.io/immich-app/immich-machine-learning:${IMMICH_VERSION:-v3}
    container_name: immich-machine-learning
    restart: unless-stopped
    volumes:
      - ${PROJECT_ROOT}/services/immich/volumes/model-cache:/cache
    networks:
      - homelab-net
    healthcheck:
      disable: false

  immich-redis:
    image: docker.io/valkey/valkey:9
    container_name: immich-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - homelab-net

  immich-postgres:
    # VectorChord (required for Immich v3). Do not use tensorchord/pgvecto-rs.
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
    container_name: immich-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: immich
      POSTGRES_DB: immich
      POSTGRES_PASSWORD_FILE: /run/secrets/immich_db_password
      POSTGRES_INITDB_ARGS: "--data-checksums"
      # Pi SD / HDD-backed DB — Immich's image tunes differently when set.
      DB_STORAGE_TYPE: HDD
    volumes:
      - ${PROJECT_ROOT}/services/immich/volumes/db:/var/lib/postgresql/data
    secrets:
      - immich_db_password
    shm_size: 128mb
    networks:
      - homelab-net
    healthcheck:
      test: >-
        pg_isready --dbname="$${POSTGRES_DB}" --username="$${POSTGRES_USER}" ||
        exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

secrets:
  immich_db_password:
    file: ${PROJECT_ROOT}/volumes/secrets/immich_db_password

networks:
  homelab-net:
    external: true
    name: homelab-net
