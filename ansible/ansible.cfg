[defaults]
inventory = inventory.yml
roles_path = roles
interpreter_python = auto_silent
retry_files_enabled = False

[ssh_connection]
# Avoid allocating a pseudo-TTY for each become operation. On newer systemd
# hosts, a TTY enables OSC shell-context annotations that Ansible mistakes for
# trailing junk after module JSON. Pipelining also reduces SSH round trips.
pipelining = True

[privilege_escalation]
become = True
become_method = sudo
