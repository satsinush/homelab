# docs/1-prerequisites.md
- name: Full system upgrade (opt-in via run_pacman_upgrade)
  community.general.pacman:
    update_cache: true
    upgrade: true
  when: run_pacman_upgrade

- name: Install core packages
  community.general.pacman:
    update_cache: true
    state: present
    name:
      - apache          # htpasswd used by setup.py
      - openssh
      - firewalld
      - docker
      - docker-compose
      - docker-buildx
      - git
      - jq
      - lm_sensors
      - arp-scan
      - nodejs
      - npm
      - argon2
      - restic
      - acl             # setfacl: UID-1000 containers read 0600 secrets
      - python

# Narrow sudo for dashboard host-api → pacman-sync.service (no general root).
- name: Install host-api sudoers for pacman-sync
  ansible.builtin.template:
    src: sudoers-homelab-host-api.j2
    dest: /etc/sudoers.d/homelab-host-api
    owner: root
    group: root
    mode: "0440"
    validate: "visudo -cf %s"
