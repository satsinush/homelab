# pihole/compose.yaml
services:
  pihole:
    image: pihole/pihole:latest
    container_name: pihole
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
    environment:
      - TZ=America/Chicago
      - FTLCONF_dns_upstreams=unbound#53
      - FTLCONF_dns_domain=${HOMELAB_HOSTNAME}
      - FTLCONF_dns_piholePTR=HOSTNAMEFQDN
      - FTLCONF_webserver_domain=${PIHOLE_SERVICE_NAME}.${HOMELAB_HOSTNAME}
      - FTLCONF_dns_listeningMode=all
      - FTLCONF_webserver_port=80
      - DNSMASQ_LISTENING=all
      - FTLCONF_webserver_api_password=
      - FTLCONF_misc_dnsmasq_lines=address=/.${HOMELAB_HOSTNAME}/${HOMELAB_IP_ADDRESS}
      - FTLCONF_dns_hosts=${HOMELAB_IP_ADDRESS} ${HOMELAB_HOSTNAME};
    volumes:
      - pihole_data:/etc/pihole/
      - pihole_logs:/run/log/pihole/
    networks:
      - homelab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.pihole.rule=Host(`${PIHOLE_SERVICE_NAME}.${HOMELAB_HOSTNAME}`)"
      - "traefik.http.routers.pihole.entrypoints=websecure"
      - "traefik.http.routers.pihole.tls=true"
      - "traefik.http.routers.pihole.middlewares=authentik-auth@file"
      - "traefik.http.services.pihole.loadbalancer.server.port=80"
    depends_on:
      unbound:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost/admin"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m

volumes:
  pihole_data:
  pihole_logs:

networks:
  homelab-net:
    external: true
