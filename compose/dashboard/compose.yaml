# compose/dashboard/compose.yaml
services:
  homelab-dashboard:
    container_name: homelab-dashboard
    restart: unless-stopped
    build:
      context: ${PROJECT_ROOT}
      dockerfile: homelab-dashboard/api/Dockerfile
    volumes:
      - dashboard_api_data:/app/api/data
      - dashboard_word_games_data:/app/word_games/data
      - ${PROJECT_ROOT}/word_games/resources:/app/word_games/resources:ro
      - ${PROJECT_ROOT}/volumes/certificates/homelab-ca.crt:/etc/ssl/certs/homelab-ca.crt:ro
      - ${PROJECT_ROOT}/volumes/public-configs:/app/public-configs:ro
    networks:
      - homelab-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${AUTHENTIK_SERVICE_NAME}.${HOMELAB_HOSTNAME}:10.10.30.100"
    environment:
      - HOMELAB_HOSTNAME=${HOMELAB_HOSTNAME}
      - HOMELAB_USERNAME=${HOMELAB_USERNAME}
      - HOMELAB_EMAIL=${HOMELAB_EMAIL}
      - HOMELAB_PASSWORD_FILE=/run/secrets/homelab_password
      - HOMELAB_API_SESSION_SECRET_FILE=/run/secrets/homelab_api_session_secret
      - DASHBOARD_OIDC_SECRET_FILE=/run/secrets/dashboard_oidc_secret
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/homelab-ca.crt
      - RUSTDESK_PUBKEY_PATH=/app/public-configs/rustdesk_public_key
      - DASHBOARD_SERVICE_NAME=${DASHBOARD_SERVICE_NAME}
      - PIHOLE_SERVICE_NAME=${PIHOLE_SERVICE_NAME}
      - DOCKHAND_SERVICE_NAME=${DOCKHAND_SERVICE_NAME}
      - VAULTWARDEN_SERVICE_NAME=${VAULTWARDEN_SERVICE_NAME}
      - GATUS_SERVICE_NAME=${GATUS_SERVICE_NAME}
      - GOTIFY_SERVICE_NAME=${GOTIFY_SERVICE_NAME}
      - AUTHENTIK_SERVICE_NAME=${AUTHENTIK_SERVICE_NAME}
      - RUSTDESK_SERVICE_NAME=${RUSTDESK_SERVICE_NAME}
      - NEXTCLOUD_SERVICE_NAME=${NEXTCLOUD_SERVICE_NAME}

    secrets:
      - homelab_password
      - homelab_api_session_secret
      - dashboard_oidc_secret
      - vaultwarden_oidc_secret
      - vaultwarden_admin_token
      - vaultwarden_admin_token_plain
      - gotify_admin_password
      - rustdesk_admin_password
      - rustdesk_api_jwt_key
      - rustdesk_oidc_secret
      - authentik_secret_key
      - authentik_pg_pass
      - authentik_akadmin_password
    labels:
      - "traefik.enable=true"
      # Canonical dashboard route
      - "traefik.http.routers.dashboard.rule=Host(`${DASHBOARD_SERVICE_NAME}.${HOMELAB_HOSTNAME}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.dashboard.tls.domains[0].main=${HOMELAB_HOSTNAME}"
      - "traefik.http.routers.dashboard.tls.domains[0].sans=*.${HOMELAB_HOSTNAME}"
      - "traefik.http.services.dashboard.loadbalancer.server.port=5000"
      - "traefik.http.routers.dashboard-redirect.rule=Host(`${HOMELAB_HOSTNAME}`) || HostRegexp(`^[0-9.]+$`)"
      - "traefik.http.routers.dashboard-redirect.entrypoints=websecure"
      - "traefik.http.routers.dashboard-redirect.tls=true"
      - "traefik.http.routers.dashboard-redirect.middlewares=dashboard-redirect-to-canonical@docker"
      - "traefik.http.routers.dashboard-redirect.service=dashboard"
      - "traefik.http.middlewares.dashboard-redirect-to-canonical.redirectregex.regex=^https?://(?:${HOMELAB_HOSTNAME}|[0-9.]+)(.*)"
      - "traefik.http.middlewares.dashboard-redirect-to-canonical.redirectregex.replacement=https://${DASHBOARD_SERVICE_NAME}.${HOMELAB_HOSTNAME}$${1}"
      - "traefik.http.middlewares.dashboard-redirect-to-canonical.redirectregex.permanent=true"
      # Catch-All Router for unknown subdomains (Lowest Priority) - Redirects to canonical dashboard
      - "traefik.http.routers.dashboard-catchall.rule=HostRegexp(`^.+\\.${HOMELAB_HOSTNAME}$$`)"
      - "traefik.http.routers.dashboard-catchall.entrypoints=websecure"
      - "traefik.http.routers.dashboard-catchall.tls=true"
      - "traefik.http.routers.dashboard-catchall.priority=1"
      - "traefik.http.routers.dashboard-catchall.middlewares=dashboard-catchall-redirect@docker"
      - "traefik.http.routers.dashboard-catchall.service=dashboard"
      
      # Middleware to redirect any host to canonical dashboard
      - "traefik.http.middlewares.dashboard-catchall-redirect.redirectregex.regex=^https?://[^/]+(.*)"
      - "traefik.http.middlewares.dashboard-catchall-redirect.redirectregex.replacement=https://${DASHBOARD_SERVICE_NAME}.${HOMELAB_HOSTNAME}$${1}"
      - "traefik.http.middlewares.dashboard-catchall-redirect.redirectregex.permanent=true"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:5000" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m



secrets:
  homelab_password:
    file: ${PROJECT_ROOT}/volumes/secrets/homelab_password
  homelab_api_session_secret:
    file: ${PROJECT_ROOT}/volumes/secrets/homelab_api_session_secret
  dashboard_oidc_secret:
    file: ${PROJECT_ROOT}/volumes/secrets/dashboard_oidc_secret
  vaultwarden_oidc_secret:
    file: ${PROJECT_ROOT}/volumes/secrets/vaultwarden_oidc_secret
  vaultwarden_admin_token:
    file: ${PROJECT_ROOT}/volumes/secrets/vaultwarden_admin_token
  vaultwarden_admin_token_plain:
    file: ${PROJECT_ROOT}/volumes/secrets/vaultwarden_admin_token_plain
  gotify_admin_password:
    file: ${PROJECT_ROOT}/volumes/secrets/gotify_admin_password
  rustdesk_admin_password:
    file: ${PROJECT_ROOT}/volumes/secrets/rustdesk_admin_password
  rustdesk_api_jwt_key:
    file: ${PROJECT_ROOT}/volumes/secrets/rustdesk_api_jwt_key
  rustdesk_oidc_secret:
    file: ${PROJECT_ROOT}/volumes/secrets/rustdesk_oidc_secret
  authentik_secret_key:
    file: ${PROJECT_ROOT}/volumes/secrets/authentik_secret_key
  authentik_pg_pass:
    file: ${PROJECT_ROOT}/volumes/secrets/authentik_pg_pass
  authentik_akadmin_password:
    file: ${PROJECT_ROOT}/volumes/secrets/authentik_akadmin_password

volumes:
  dashboard_api_data:
  dashboard_word_games_data:

networks:
  homelab-net:
    external: true
