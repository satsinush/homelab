# compose/dashboard/compose.yaml
services:
  homelab-dashboard:
    container_name: homelab-dashboard
    restart: on-failure
    build:
      context: ${PROJECT_ROOT}
      dockerfile: homelab-dashboard/api/Dockerfile
    volumes:
      - dashboard_api_data:/app/api/data
      - dashboard_word_games_data:/app/word_games/data
      - ${PROJECT_ROOT}/word_games/resources:/app/word_games/resources:ro
      - ${PROJECT_ROOT}/volumes/certificates/homelab-ca.crt:/etc/ssl/certs/homelab-ca.crt:ro
      - ${PROJECT_ROOT}/volumes/secrets:/secrets:ro
    networks:
      - homelab-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "${AUTHENTIK_WEB_HOSTNAME}:10.10.30.100"
    environment:
      - AUTHENTIK_WEB_HOSTNAME=${AUTHENTIK_WEB_HOSTNAME}
      - DASHBOARD_WEB_HOSTNAME=${DASHBOARD_WEB_HOSTNAME}
      - HOMELAB_HOSTNAME=${HOMELAB_HOSTNAME}
      - HOMELAB_USERNAME=${HOMELAB_USERNAME}
      - HOMELAB_EMAIL=${HOMELAB_EMAIL}
      - HOMELAB_PASSWORD_FILE=/secrets/homelab_password
      - HOMELAB_API_SESSION_SECRET_FILE=/secrets/homelab_api_session_secret
      - DASHBOARD_OIDC_SECRET_FILE=/secrets/dashboard_oidc_secret
      - NODE_EXTRA_CA_CERTS=/etc/ssl/certs/homelab-ca.crt
      - RUSTDESK_PUBKEY_PATH=/secrets/rustdesk_public_key
      - PIHOLE_WEB_HOSTNAME=${PIHOLE_WEB_HOSTNAME}
      - NETDATA_WEB_HOSTNAME=${NETDATA_WEB_HOSTNAME}
      - PORTAINER_WEB_HOSTNAME=${PORTAINER_WEB_HOSTNAME}
      - DOCKGE_WEB_HOSTNAME=${DOCKGE_WEB_HOSTNAME}
      - DOCKHAND_WEB_HOSTNAME=${DOCKHAND_WEB_HOSTNAME}
      - VAULTWARDEN_WEB_HOSTNAME=${VAULTWARDEN_WEB_HOSTNAME}
      - UPTIME_KUMA_WEB_HOSTNAME=${UPTIME_KUMA_WEB_HOSTNAME}
      - GOTIFY_WEB_HOSTNAME=${GOTIFY_WEB_HOSTNAME}
    labels:
      - "traefik.enable=true"
      # Canonical dashboard route
      - "traefik.http.routers.dashboard.rule=Host(`${DASHBOARD_WEB_HOSTNAME}`)"
      - "traefik.http.routers.dashboard.entrypoints=websecure"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.dashboard.tls.domains[0].main=${HOMELAB_HOSTNAME}"
      - "traefik.http.routers.dashboard.tls.domains[0].sans=*.${HOMELAB_HOSTNAME}"
      - "traefik.http.services.dashboard.loadbalancer.server.port=5000"
      - "traefik.http.routers.dashboard-redirect.rule=Host(`${HOMELAB_HOSTNAME}`) || HostRegexp(`^[0-9.]+$`)"
      - "traefik.http.routers.dashboard-redirect.entrypoints=websecure"
      - "traefik.http.routers.dashboard-redirect.tls=true"
      - "traefik.http.routers.dashboard-redirect.middlewares=dashboard-redirect-to-canonical@docker"
      - "traefik.http.routers.dashboard-redirect.service=dashboard"
      - "traefik.http.middlewares.dashboard-redirect-to-canonical.redirectregex.regex=^https?://(?:${HOMELAB_HOSTNAME}|[0-9.]+)(.*)"
      - "traefik.http.middlewares.dashboard-redirect-to-canonical.redirectregex.replacement=https://${DASHBOARD_WEB_HOSTNAME}$${1}"
      - "traefik.http.middlewares.dashboard-redirect-to-canonical.redirectregex.permanent=true"
      # Catch-All Router for unknown subdomains (Lowest Priority) - Redirects to canonical dashboard
      - "traefik.http.routers.dashboard-catchall.rule=HostRegexp(`^.+\\.${HOMELAB_HOSTNAME}$$`)"
      - "traefik.http.routers.dashboard-catchall.entrypoints=websecure"
      - "traefik.http.routers.dashboard-catchall.tls=true"
      - "traefik.http.routers.dashboard-catchall.priority=1"
      - "traefik.http.routers.dashboard-catchall.middlewares=dashboard-catchall-redirect@docker"
      - "traefik.http.routers.dashboard-catchall.service=dashboard"
      
      # Middleware to redirect any host to canonical dashboard
      - "traefik.http.middlewares.dashboard-catchall-redirect.redirectregex.regex=^https?://[^/]+(.*)"
      - "traefik.http.middlewares.dashboard-catchall-redirect.redirectregex.replacement=https://${DASHBOARD_WEB_HOSTNAME}$${1}"
      - "traefik.http.middlewares.dashboard-catchall-redirect.redirectregex.permanent=true"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost:5000" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m

volumes:
  dashboard_api_data:
  dashboard_word_games_data:

networks:
  homelab-net:
    external: true
