# compose/apps/compose.yaml
services:
  rustdesk-id-server:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-id-server
    command: hbbs -r rustdesk-relay-server:21119 -k _
    volumes:
      - rustdesk_data:/root
    networks:
      - homelab-net
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    restart: unless-stopped
    depends_on:
      - rustdesk-relay-server

  rustdesk-relay-server:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-relay-server
    command: hbbr -k _
    volumes:
      - rustdesk_data:/root
    networks:
      - homelab-net
    ports:
      - "21119:21119"
      - "21117:21117"
    restart: unless-stopped

  ddclient:
    image: linuxserver/ddclient:latest
    container_name: ddclient
    restart: on-failure
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    networks:
      - homelab-net
    volumes:
      - ${PROJECT_ROOT}/ddclient/ddclient.conf:/config/ddclient.conf
    healthcheck:
      test: [ "CMD", "pgrep", "ddclient" ]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 1m

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: on-failure
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - homelab-net
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: on-failure
    volumes:
      - vaultwarden_data:/data
      - ${PROJECT_ROOT}/volumes/certificates/homelab-ca.crt:/etc/ssl/certs/homelab-ca.crt:ro
    extra_hosts:
      - "${AUTHENTIK_WEB_HOSTNAME}:10.10.30.100"
    networks:
      - homelab-net
    environment:
      - SSL_CERT_FILE=/etc/ssl/certs/homelab-ca.crt
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=false
      - DOMAIN=https://${VAULTWARDEN_WEB_HOSTNAME}
      - SMTP_SSL_CA_CERT=/etc/ssl/certs/homelab-ca.crt
      - SMTP_HOST=apprise-api
      - SMTP_PORT=8025
      - SMTP_SECURITY=off
      - SMTP_FROM=vaultwarden@${HOMELAB_HOSTNAME}
      - SSO_ENABLED=true
      - SSO_CLIENT_ID=vaultwarden
      - SSO_AUTHORITY=https://${AUTHENTIK_WEB_HOSTNAME}/application/o/vaultwarden/
      - SSO_SCOPES=openid email profile offline_access groups
      - SSO_CLIENT_SECRET_FILE=/run/secrets/vaultwarden_oidc_secret
      - ADMIN_TOKEN_FILE=/run/secrets/vaultwarden_admin_token
    secrets:
      - vaultwarden_oidc_secret
      - vaultwarden_admin_token
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`${VAULTWARDEN_WEB_HOSTNAME}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls=true"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
    depends_on:
      apprise-api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:80/alive" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m

  gotify:
    image: docker.io/gotify/server:latest
    container_name: gotify
    restart: unless-stopped
    volumes:
      - gotify_data:/app/data
      - ${PROJECT_ROOT}/gotify/homelab-icon.png:/app/homelab-icon.png:ro
    environment:
      - GOTIFY_SERVER_PORT=80
      - TZ=${TZ}
    networks:
      - homelab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gotify.rule=Host(`${GOTIFY_WEB_HOSTNAME}`)"
      - "traefik.http.routers.gotify.entrypoints=websecure"
      - "traefik.http.routers.gotify.tls=true"
      - "traefik.http.routers.gotify.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.services.gotify.loadbalancer.server.port=80"

  apprise-api:
    build: ${PROJECT_ROOT}/apprise
    container_name: apprise-api
    restart: unless-stopped
    volumes:
      - ${PROJECT_ROOT}/volumes/certificates/homelab-ca.crt:/etc/ssl/certs/homelab-ca.crt:ro
      - ${PROJECT_ROOT}/apprise/volumes/config:/config:ro
      - ${PROJECT_ROOT}/apprise/apprise_gateway.py:/app/apprise_gateway.py:ro
    environment:
      - SSL_CERT_FILE=/etc/ssl/certs/homelab-ca.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/homelab-ca.crt
      - CURL_CA_BUNDLE=/etc/ssl/certs/homelab-ca.crt
      - PYTHONUNBUFFERED=1
    networks:
      - homelab-net
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8025"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  vaultwarden_oidc_secret:
    file: ${PROJECT_ROOT}/volumes/secrets/vaultwarden_oidc_secret
  vaultwarden_admin_token:
    file: ${PROJECT_ROOT}/volumes/secrets/vaultwarden_admin_token

volumes:
  ollama_data:
  rustdesk_data:
  vaultwarden_data:
  gotify_data:

networks:
  homelab-net:
    external: true
