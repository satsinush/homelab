# compose/apps/compose.yaml
services:
  rustdesk-id-server:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-id-server
    command: hbbs -r rustdesk-relay-server:21119 -k _
    volumes:
      - rustdesk_data:/root
    networks:
      - homelab-net
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    restart: unless-stopped
    depends_on:
      - rustdesk-relay-server

  rustdesk-relay-server:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-relay-server
    command: hbbr -k _
    volumes:
      - rustdesk_data:/root
    networks:
      - homelab-net
    ports:
      - "21119:21119"
      - "21117:21117"
    restart: unless-stopped

  # Open-source API / web console. Authentik OIDC provider is created by
  # rustdesk/setup.py via the admin API after the container is healthy.
  # Secrets are loaded by entrypoint.sh (app has no *_FILE support).
  rustdesk-console:
    image: ghcr.io/dockers-x/rustdesk-console:latest
    container_name: rustdesk-console
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    command: ["./rustdesk-console", "-c", "./conf/config.yaml"]
    environment:
      - TZ=${TZ}
      - RUSTDESK_API_LANG=en
      - RUSTDESK_API_RUSTDESK_ID_SERVER=${HOMELAB_HOSTNAME}:21116
      - RUSTDESK_API_RUSTDESK_RELAY_SERVER=${HOMELAB_HOSTNAME}:21117
      - RUSTDESK_API_RUSTDESK_API_SERVER=https://${RUSTDESK_SERVICE_NAME}.${HOMELAB_HOSTNAME}
      - RUSTDESK_API_ADMIN_USERNAME=admin
      - RUSTDESK_API_ADMIN_FORCE_CHANGE_PASSWORD=false
      - RUSTDESK_API_APP_REGISTER=false
      - SSL_CERT_FILE=/etc/ssl/certs/homelab-ca.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/homelab-ca.crt
    volumes:
      - rustdesk_console_data:/app/data
      - ${PROJECT_ROOT}/rustdesk/entrypoint.sh:/entrypoint.sh:ro
      - ${PROJECT_ROOT}/volumes/certificates/homelab-ca.crt:/etc/ssl/certs/homelab-ca.crt:ro
      - ${PROJECT_ROOT}/volumes/public-configs/rustdesk_public_key:/app/public-configs/rustdesk_public_key:ro
    secrets:
      - rustdesk_admin_password
      - rustdesk_api_jwt_key
    extra_hosts:
      - "${AUTHENTIK_SERVICE_NAME}.${HOMELAB_HOSTNAME}:10.10.30.100"
    networks:
      - homelab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rustdesk.rule=Host(`${RUSTDESK_SERVICE_NAME}.${HOMELAB_HOSTNAME}`)"
      - "traefik.http.routers.rustdesk.entrypoints=websecure"
      - "traefik.http.routers.rustdesk.tls=true"
      - "traefik.http.routers.rustdesk.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.services.rustdesk.loadbalancer.server.port=21114"
    depends_on:
      - rustdesk-id-server
      - rustdesk-relay-server
      - rustdesk-oidc-proxy

  # Rewrites OIDC discovery so rustdesk-console (rustls) can reach Authentik
  # without trusting the homelab CA, while browsers still use public HTTPS.
  rustdesk-oidc-proxy:
    image: python:3.12-alpine
    container_name: rustdesk-oidc-proxy
    restart: unless-stopped
    # PyJWT + cryptography: re-sign id_tokens so iss matches rustdesk's
    # slash-stripped issuer check (Authentik always emits a trailing slash).
    command:
      - sh
      - -c
      - pip install --quiet --disable-pip-version-check -r /app/requirements.txt && exec python /app/oidc_discovery_proxy.py
    environment:
      - AUTHENTIK_INTERNAL=http://authentik-server:9000
      - AUTHENTIK_PUBLIC_HOST=${AUTHENTIK_SERVICE_NAME}.${HOMELAB_HOSTNAME}
      - OIDC_APP_SLUG=rustdesk
      - PYTHONUNBUFFERED=1
      - RUSTDESK_DB_PATH=/data/rustdeskapi.db
      - RUSTDESK_ADMIN_ROLES=rustdesk-admin,homelab-admin
      - RUSTDESK_ADMIN_GROUPS=homelab-admins
    volumes:
      - ${PROJECT_ROOT}/rustdesk/oidc_discovery_proxy.py:/app/oidc_discovery_proxy.py:ro
      - ${PROJECT_ROOT}/rustdesk/requirements.txt:/app/requirements.txt:ro
      - rustdesk_console_data:/data
    networks:
      - homelab-net

  ddclient:
    image: linuxserver/ddclient:latest
    container_name: ddclient
    restart: unless-stopped
    environment:
      - TZ=${TZ}
      - PUID=${PUID}
      - PGID=${PGID}
    networks:
      - homelab-net
    volumes:
      - ${PROJECT_ROOT}/ddclient/ddclient.conf:/config/ddclient.conf
    healthcheck:
      test: [ "CMD", "pgrep", "ddclient" ]
      interval: 5m
      timeout: 10s
      retries: 2
      start_period: 1m

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - homelab-net
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m

  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden
    restart: unless-stopped
    volumes:
      - vaultwarden_data:/data
      - ${PROJECT_ROOT}/volumes/certificates/homelab-ca.crt:/etc/ssl/certs/homelab-ca.crt:ro
    extra_hosts:
      - "${AUTHENTIK_SERVICE_NAME}.${HOMELAB_HOSTNAME}:10.10.30.100"
    networks:
      - homelab-net
    environment:
      - SSL_CERT_FILE=/etc/ssl/certs/homelab-ca.crt
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=false
      - DOMAIN=https://${VAULTWARDEN_SERVICE_NAME}.${HOMELAB_HOSTNAME}
      - SMTP_SSL_CA_CERT=/etc/ssl/certs/homelab-ca.crt
      - SMTP_HOST=apprise-api
      - SMTP_PORT=8025
      - SMTP_SECURITY=off
      - SMTP_FROM=vaultwarden@${HOMELAB_HOSTNAME}
      - SSO_ENABLED=true
      - SSO_CLIENT_ID=vaultwarden
      - SSO_AUTHORITY=https://${AUTHENTIK_SERVICE_NAME}.${HOMELAB_HOSTNAME}/application/o/vaultwarden/
      - SSO_SCOPES=openid email profile offline_access groups
      - SSO_CLIENT_SECRET_FILE=/run/secrets/vaultwarden_oidc_secret
      - ADMIN_TOKEN_FILE=/run/secrets/vaultwarden_admin_token
    secrets:
      - vaultwarden_oidc_secret
      - vaultwarden_admin_token
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`${VAULTWARDEN_SERVICE_NAME}.${HOMELAB_HOSTNAME}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls=true"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"
    depends_on:
      apprise-api:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-fs", "http://localhost:80/alive" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 1m

  nextcloud-db:
    image: postgres:16-alpine
    container_name: nextcloud-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD_FILE=/run/secrets/nextcloud_db_password
    secrets:
      - nextcloud_db_password
    volumes:
      - nextcloud_db:/var/lib/postgresql/data
    networks:
      - homelab-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  nextcloud-redis:
    image: redis:7-alpine
    container_name: nextcloud-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - homelab-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  nextcloud:
    image: nextcloud:apache
    container_name: nextcloud
    restart: unless-stopped
    depends_on:
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
      apprise-api:
        condition: service_healthy
    volumes:
      - nextcloud_data:/var/www/html
      - ${PROJECT_ROOT}/volumes/certificates/homelab-ca.crt:/usr/local/share/ca-certificates/homelab-ca.crt:ro
      - ${PROJECT_ROOT}/homelab-dashboard/frontend/public/homelab-icon.svg:/mnt/homelab-branding/logo.svg:ro
      - ${PROJECT_ROOT}/homelab-dashboard/frontend/public/favicon.ico:/mnt/homelab-branding/favicon.ico:ro
      - ${PROJECT_ROOT}/homelab-dashboard/frontend/src/assets/nextcloud_logo.png:/mnt/homelab-branding/nextcloud_logo.png:ro
    extra_hosts:
      - "${AUTHENTIK_SERVICE_NAME}.${HOMELAB_HOSTNAME}:10.10.30.100"
    environment:
      - POSTGRES_HOST=nextcloud-db
      - POSTGRES_DB=nextcloud
      - POSTGRES_USER=nextcloud
      - POSTGRES_PASSWORD_FILE=/run/secrets/nextcloud_db_password
      - REDIS_HOST=nextcloud-redis
      - NEXTCLOUD_ADMIN_USER=${HOMELAB_USERNAME}
      - NEXTCLOUD_ADMIN_PASSWORD_FILE=/run/secrets/nextcloud_admin_password
      - NEXTCLOUD_TRUSTED_DOMAINS=${NEXTCLOUD_SERVICE_NAME}.${HOMELAB_HOSTNAME}
      - OVERWRITEPROTOCOL=https
      - OVERWRITEHOST=${NEXTCLOUD_SERVICE_NAME}.${HOMELAB_HOSTNAME}
      - OVERWRITECLIURL=https://${NEXTCLOUD_SERVICE_NAME}.${HOMELAB_HOSTNAME}
      - TRUSTED_PROXIES=10.10.30.0/24
      - PHP_MEMORY_LIMIT=512M
      - TZ=${TZ}
      - SMTP_HOST=apprise-api
      - SMTP_PORT=8025
      - SMTP_SECURE=
      - MAIL_FROM_ADDRESS=nextcloud
      - MAIL_DOMAIN=${HOMELAB_HOSTNAME}
    secrets:
      - nextcloud_db_password
      - nextcloud_admin_password
      - nextcloud_oidc_secret
    networks:
      - homelab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nextcloud.rule=Host(`${NEXTCLOUD_SERVICE_NAME}.${HOMELAB_HOSTNAME}`)"
      - "traefik.http.routers.nextcloud.entrypoints=websecure"
      - "traefik.http.routers.nextcloud.tls=true"
      - "traefik.http.routers.nextcloud.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.nextcloud.middlewares=nextcloud-hsts"
      - "traefik.http.middlewares.nextcloud-hsts.headers.stsSeconds=15552000"
      - "traefik.http.middlewares.nextcloud-hsts.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.nextcloud-hsts.headers.forceSTSHeader=true"
      - "traefik.http.services.nextcloud.loadbalancer.server.port=80"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/status.php"]
      interval: 1m
      timeout: 10s
      retries: 5
      start_period: 3m

  # Official Nextcloud image cron sidecar (runs cron.php as www-data every 5m)
  nextcloud-cron:
    image: nextcloud:apache
    container_name: nextcloud-cron
    restart: unless-stopped
    entrypoint: /cron.sh
    volumes:
      - nextcloud_data:/var/www/html
    depends_on:
      nextcloud:
        condition: service_healthy
      nextcloud-db:
        condition: service_healthy
      nextcloud-redis:
        condition: service_healthy
    networks:
      - homelab-net

  # Collabora Online (CODE) — LibreOffice editing for Nextcloud
  collabora:
    image: collabora/code:latest
    container_name: collabora
    restart: unless-stopped
    # CODE needs these for kit jail bind-mounts (otherwise falls back to slow copy)
    cap_add:
      - MKNOD
      - SYS_ADMIN
      - SYS_CHROOT
      - FOWNER
    security_opt:
      - seccomp:unconfined
    tty: true
    entrypoint: ["/bin/bash", "/entrypoint.sh"]
    environment:
      - TZ=${TZ}
      - aliasgroup1=https://${NEXTCLOUD_SERVICE_NAME}.${HOMELAB_HOSTNAME}:443
      - server_name=${COLLABORA_SERVICE_NAME}.${HOMELAB_HOSTNAME}
      - username=admin
      - DONT_GEN_SSL_CERT=true
      # System CAs + Homelab root (built into collabora-ca-bundle.crt)
      - SSL_CERT_FILE=/etc/coolwsd/ca-bundle.crt
      - CURL_CA_BUNDLE=/etc/coolwsd/ca-bundle.crt
      - REQUESTS_CA_BUNDLE=/etc/coolwsd/ca-bundle.crt
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true --o:ssl.ssl_verification=true --o:ssl.ca_file_path=/etc/coolwsd/ca-bundle.crt --o:net.frame_ancestors=${NEXTCLOUD_SERVICE_NAME}.${HOMELAB_HOSTNAME} --o:welcome.enable=false --o:logging.level=warning
      - dictionaries=en_US
    secrets:
      - collabora_admin_password
    volumes:
      - ${PROJECT_ROOT}/collabora/entrypoint.sh:/entrypoint.sh:ro
      - ${PROJECT_ROOT}/volumes/certificates/collabora-ca-bundle.crt:/etc/coolwsd/ca-bundle.crt:ro
    extra_hosts:
      - "${NEXTCLOUD_SERVICE_NAME}.${HOMELAB_HOSTNAME}:10.10.30.100"
    networks:
      - homelab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.collabora.rule=Host(`${COLLABORA_SERVICE_NAME}.${HOMELAB_HOSTNAME}`)"
      - "traefik.http.routers.collabora.entrypoints=websecure"
      - "traefik.http.routers.collabora.tls=true"
      - "traefik.http.routers.collabora.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.services.collabora.loadbalancer.server.port=9980"
      - "traefik.http.services.collabora.loadbalancer.server.scheme=http"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/9980'"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 90s

  gotify:
    image: docker.io/gotify/server:latest
    container_name: gotify
    restart: unless-stopped
    volumes:
      - gotify_data:/app/data
      - ${PROJECT_ROOT}/gotify/homelab-icon.png:/app/homelab-icon.png:ro
    environment:
      - GOTIFY_SERVER_PORT=80
      - TZ=${TZ}
    networks:
      - homelab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gotify.rule=Host(`${GOTIFY_SERVICE_NAME}.${HOMELAB_HOSTNAME}`)"
      - "traefik.http.routers.gotify.entrypoints=websecure"
      - "traefik.http.routers.gotify.tls=true"
      - "traefik.http.routers.gotify.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.services.gotify.loadbalancer.server.port=80"

  apprise-api:
    build: ${PROJECT_ROOT}/apprise
    container_name: apprise-api
    restart: unless-stopped
    volumes:
      - ${PROJECT_ROOT}/volumes/certificates/homelab-ca.crt:/etc/ssl/certs/homelab-ca.crt:ro
      - ${PROJECT_ROOT}/apprise/volumes/config:/config:ro
      - ${PROJECT_ROOT}/apprise/apprise_gateway.py:/app/apprise_gateway.py:ro
    environment:
      - SSL_CERT_FILE=/etc/ssl/certs/homelab-ca.crt
      - REQUESTS_CA_BUNDLE=/etc/ssl/certs/homelab-ca.crt
      - CURL_CA_BUNDLE=/etc/ssl/certs/homelab-ca.crt
      - PYTHONUNBUFFERED=1
    networks:
      - homelab-net
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8025"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

secrets:
  vaultwarden_oidc_secret:
    file: ${PROJECT_ROOT}/volumes/secrets/vaultwarden_oidc_secret
  vaultwarden_admin_token:
    file: ${PROJECT_ROOT}/volumes/secrets/vaultwarden_admin_token
  rustdesk_admin_password:
    file: ${PROJECT_ROOT}/volumes/secrets/rustdesk_admin_password
  rustdesk_api_jwt_key:
    file: ${PROJECT_ROOT}/volumes/secrets/rustdesk_api_jwt_key
  nextcloud_oidc_secret:
    file: ${PROJECT_ROOT}/volumes/secrets/nextcloud_oidc_secret
  nextcloud_db_password:
    file: ${PROJECT_ROOT}/volumes/secrets/nextcloud_db_password
  nextcloud_admin_password:
    file: ${PROJECT_ROOT}/volumes/secrets/nextcloud_admin_password
  collabora_admin_password:
    file: ${PROJECT_ROOT}/volumes/secrets/collabora_admin_password

volumes:
  ollama_data:
  rustdesk_data:
  rustdesk_console_data:
  vaultwarden_data:
  gotify_data:
  nextcloud_data:
  nextcloud_db:

networks:
  homelab-net:
    external: true
