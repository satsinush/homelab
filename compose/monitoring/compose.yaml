# compose/monitoring/compose.yaml
services:
  gatus:
    image: twinproduction/gatus:latest
    container_name: gatus
    restart: on-failure
    volumes:
      - ${PROJECT_ROOT}/gatus/config.yaml:/config/config.yaml:ro
    networks:
      - homelab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gatus.rule=Host(`${GATUS_WEB_HOSTNAME}`)"
      - "traefik.http.routers.gatus.entrypoints=websecure"
      - "traefik.http.routers.gatus.tls=true"
      - "traefik.http.routers.gatus.middlewares=authentik-auth@file"
      - "traefik.http.services.gatus.loadbalancer.server.port=8080"

networks:
  homelab-net:
    external: true
