# headscale/compose.yaml — self-hosted Tailscale control plane + LAN subnet router
services:
  headscale:
    image: docker.io/headscale/headscale:0.29.2
    container_name: headscale
    restart: unless-stopped
    command: serve
    read_only: true
    tmpfs:
      - /var/run/headscale
    volumes:
      - ${PROJECT_ROOT}/headscale/volumes/config:/etc/headscale:ro
      - ${PROJECT_ROOT}/headscale/volumes/data:/var/lib/headscale
    environment:
      SSL_CERT_FILE: /etc/headscale/ca-bundle.crt
    secrets:
      - headscale_oidc_secret
    # Embedded DERP STUN — self-hosted NAT traversal (router forwards WAN 3478/udp).
    ports:
      - "3478:3478/udp"
    extra_hosts:
      - "${AUTHENTIK_SERVICE_NAME}.${HOMELAB_HOSTNAME}:${TRAEFIK_IP_ADDRESS}"
    networks:
      - homelab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.headscale.rule=Host(`${HEADSCALE_SERVICE_NAME}.${HOMELAB_HOSTNAME}`)"
      # Reachable internally (websecure/443) AND from the internet-forwarded
      # public entrypoint (websecure-public/8443). No other service is on 8443.
      - "traefik.http.routers.headscale.entrypoints=websecure,websecure-public"
      - "traefik.http.routers.headscale.tls=true"
      - "traefik.http.services.headscale.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      authentik-server:
        condition: service_started

  # Host-network Tailscale node that advertises the LAN so remote clients can
  # reach 10.x devices. Auth key is written by headscale/setup.py postsetup.
  headscale-router:
    image: docker.io/tailscale/tailscale:v1.86.2
    container_name: headscale-router
    # Started by Headscale postsetup after it creates the pre-auth key.
    profiles: ["headscale-router"]
    restart: unless-stopped
    network_mode: host
    environment:
      # containerboot supports file:/path for Docker secrets
      TS_AUTHKEY: file:/run/secrets/headscale_router_authkey
      TS_AUTH_ONCE: "true"
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"
      TS_HOSTNAME: homelab-router
      # No SNAT preserves tailnet source IPs for bidirectional routing. Host
      # firewalld owns filtering/forwarding, so avoid parallel legacy iptables
      # rules from tailscaled. The LAN gateway needs HEADSCALE_IPV4_PREFIX via
      # this host.
      # containerboot has no TS_LOGIN_SERVER variable; custom control servers
      # are selected through the arguments passed to `tailscale up`.
      TS_EXTRA_ARGS: --login-server=https://${HEADSCALE_SERVICE_NAME}.${HOMELAB_HOSTNAME} --advertise-routes=${LAN_SUBNET} --accept-routes --accept-dns=false --snat-subnet-routes=false --netfilter-mode=off
      # Pin the WireGuard data-plane port (tailscaled flag, not `tailscale up`)
      # so the router can forward WAN 41641/udp for direct peer connections.
      TS_TAILSCALED_EXTRA_ARGS: --port=41641
      TS_ACCEPT_DNS: "false"
    volumes:
      - ${PROJECT_ROOT}/headscale/volumes/router:/var/lib/tailscale
      - ${PROJECT_ROOT}/headscale/volumes/config/ca-bundle.crt:/etc/ssl/certs/ca-certificates.crt:ro
    secrets:
      - headscale_router_authkey
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      headscale:
        condition: service_healthy

secrets:
  headscale_oidc_secret:
    file: ${PROJECT_ROOT}/volumes/secrets/headscale_oidc_secret
  headscale_router_authkey:
    file: ${PROJECT_ROOT}/volumes/secrets/headscale_router_authkey

networks:
  homelab-net:
    external: true
