# Apprise Configuration File
# Generated/templated by apprise/setup.py — tokens come from the Gotify alerts user apps.
# Gateway posts with tag=<service> (gatus|dashboard|vaultwarden|dockhand|general).

urls:
  - gotify://gotify/${GOTIFY_TOKEN_GATUS}:
      - tag: gatus
  - gotify://gotify/${GOTIFY_TOKEN_DASHBOARD}:
      - tag: dashboard
  - gotify://gotify/${GOTIFY_TOKEN_VAULTWARDEN}:
      - tag: vaultwarden
  - gotify://gotify/${GOTIFY_TOKEN_DOCKHAND}:
      - tag: dockhand
  - gotify://gotify/${GOTIFY_TOKEN_GENERAL}:
      - tag: general
