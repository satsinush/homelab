# rustdesk/compose.yaml — OSS ID (hbbs) + relay (hbbr) only
services:
  rustdesk-id-server:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-id-server
    # -r must be an address *clients* can reach (LAN/VPN IP), not a Docker DNS name.
    command: hbbs -r ${HOMELAB_IP_ADDRESS}:21117 -k _
    volumes:
      - ${PROJECT_ROOT}/rustdesk/volumes/server:/root
    networks:
      - homelab-net
    ports:
      - "21115:21115"
      - "21116:21116"
      - "21116:21116/udp"
      - "21118:21118"
    restart: unless-stopped
    # No healthcheck: the image has no shell/nc to probe with (its built-in
    # script needs the s6 layout we bypass by running hbbs/hbbr separately).
    # Gatus TCP-checks 21116/21117 from outside instead.
    depends_on:
      - rustdesk-relay-server

  rustdesk-relay-server:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-relay-server
    command: hbbr -k _
    volumes:
      - ${PROJECT_ROOT}/rustdesk/volumes/server:/root
    networks:
      - homelab-net
    ports:
      - "21119:21119"
      - "21117:21117"
    restart: unless-stopped

networks:
  homelab-net:
    external: true
