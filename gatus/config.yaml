web:
  port: 8080

alerting:
  custom:
    url: "http://apprise-api/alerts/gatus"
    method: "POST"
    headers:
      Content-Type: "application/json"
    
    # ─── GLOBAL ALERTS DEFAULT ───
    # This automatically applies to all endpoints below, keeping your YAML tiny.
    default-alert:
      failure-threshold: 2     # Must fail 2 times in a row before triggering (ignores random blips)
      success-threshold: 1     # Instantly resolves on the first successful pass
      send-on-resolved: true   # Keep this true globally

    body: |
      {
        "title": "Gatus Alert ([ALERT_TRIGGERED_OR_RESOLVED]): [ENDPOINT_NAME]",
        "message": "[ALERT_DESCRIPTION]\n\nTarget: [ENDPOINT_URL]"
      }

endpoints:
  # ─── REVERSE PROXY ───
  - name: "Traefik"
    group: "Reverse Proxy"
    url: "http://traefik:8082/ping"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == OK"
    alerts:
      - type: custom
        description: "Traefik reverse proxy is unhealthy"

  # ─── APPLICATIONS ───
  - name: "Dashboard"
    group: "Applications"
    url: "http://dashboard:5000/health"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "Homelab Dashboard is down"

  - name: "Dockhand"
    group: "Applications"
    url: "http://dockhand:3000/"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "Dockhand is unreachable"

  - name: "Host API"
    group: "Applications"
    url: "http://host.docker.internal:5001/health"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "Homelab Host API is unreachable"

  - name: "Ollama"
    group: "Applications"
    url: "http://ollama:11434/"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == Ollama is running"
    alerts:
      - type: custom
        description: "Ollama service is unresponsive"

  # ─── IDENTITY ───
  - name: "Authentik"
    group: "Identity"
    url: "http://authentik-server:9000/-/health/live/"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
    alerts:
      # Overriding defaults here for security: alert instantly on 1 failure, bug me every 5m
      - type: custom
        description: "Authentik is down! Authentication is completely broken."
        failure-threshold: 1

  - name: "Vaultwarden"
    group: "Identity"
    url: "http://vaultwarden:80/alive"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "Vaultwarden is unreachable"

  # ─── DNS ───
  - name: "Pi-hole"
    group: "DNS"
    # Root path 403s when the Host header isn't the admin domain; the login
    # page is always an unauthenticated 200.
    url: "http://pihole:80/admin/login"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "Pi-hole DNS admin portal is unresponsive"

  - name: "DNS Resolution"
    group: "DNS"
    url: "pihole"
    interval: 30s
    dns:
      query-name: "google.com"
      query-type: "A"
    conditions:
      - "[DNS_RCODE] == NOERROR"
    alerts:
      - type: custom
        description: "DNS resolution through Pi-hole is failing"

  - name: "ddclient"
    group: "DNS"
    url: "icmp://ddclient"
    interval: 1m
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: custom
        description: "ddclient container is unreachable"

  # ─── VPN & REMOTE ACCESS ───
  - name: "Headscale"
    group: "VPN & Remote Access"
    url: "http://headscale:8080/health"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "Headscale control plane is unreachable"

  - name: "RustDesk ID Server"
    group: "VPN & Remote Access"
    url: "tcp://rustdesk-id-server:21116"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: custom
        description: "RustDesk ID Server (hbbs) is unreachable"

  - name: "RustDesk Relay Server"
    group: "VPN & Remote Access"
    url: "tcp://rustdesk-relay-server:21117"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: custom
        description: "RustDesk Relay Server (hbbr) is unreachable"

  # ─── FILE SHARING ───
  - name: "Samba SMB"
    group: "File Sharing"
    url: "tcp://samba:445"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: custom
        description: "Samba SMB is unreachable"

  - name: "WebDAV (SFTPGo)"
    group: "File Sharing"
    url: "tcp://sftpgo:8080"
    interval: 30s
    conditions:
      - "[CONNECTED] == true"
    alerts:
      - type: custom
        description: "SFTPGo WebDAV is unreachable"

  # ─── MONITORING ───
  - name: "Gotify"
    group: "Monitoring"
    url: "http://gotify:80/health"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "Gotify notification server is unhealthy"

  - name: "Apprise Gateway"
    group: "Monitoring"
    url: "http://apprise-api:80/health"
    interval: 30s
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: custom
        description: "Apprise API Gateway is down (Alerting chain compromised!)"