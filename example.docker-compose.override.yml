services:
  dashboard:
    command: npm run dev
    environment:
      - ENVIRONMENT=development
    ports:
      - "5000:5000"
    volumes:
      - ./dashboard/api:/app/api
      - /app/api/node_modules

  dashboard-dev:
    container_name: dashboard-dev
    build: ./dashboard/frontend
    command: npm run dev
    ports:
      - "5173:5173"
    volumes:
      - ./dashboard/frontend:/app
      - /app/node_modules
    networks:
      - homelab-net

  pihole:
    ports:
      - "8080:80/tcp"

  ollama:
    ports:
      - "11434:11434"

  vaultwarden:
    ports:
      - "8000:80"
  
  gatus:
    ports:
      - "8085:8080"

  gotify:
    ports:
      - "8083:80"

  authentik-server:
    ports:
      - "9005:9000"
      - "9445:9443"

  # Windows/Docker Desktop: host 445 is owned by Windows SMB. Publish Samba on 4445.
  # Windows Explorer cannot use a custom SMB port (\\host:4445\share will fail).
  # Prefer WebDAV from Windows, or smbclient/macOS with :4445. Pi: omit this block (use 445).
  # Clients that support non-445: smb://host:4445/username
  samba:
    ports: !override
      - "4445:445"
