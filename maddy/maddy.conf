# Maddy Mail Server Configuration
# Generated for ${HOMELAB_HOSTNAME}

hostname mx.${HOMELAB_HOSTNAME}
primary_domain ${HOMELAB_HOSTNAME}
local_domains $(primary_domain)

# Authentication backend using SQLite
auth.pass_table local_authdb {
    table sql_table {
        driver sqlite3
        dsn /data/credentials.db
        table_name passwords
    }
}

# IMAP Storage backend using SQLite
storage.imapsql local_mailboxes {
    driver sqlite3
    dsn /data/imapsql.db
}

# SMTP Listener (inbound mail from other containers)
smtp tcp://0.0.0.0:25 {
    tls off
    insecure_auth true

    default_source {
        destination postmaster $(local_domains) {
            check {
                # Notify the alerts gateway via webhook when email is received
                command /usr/bin/curl -fsS -o /dev/null -H "Content-Type: message/rfc822" --data-binary @- http://alerts/alerts
            }
            deliver_to &local_mailboxes
        }
        default_destination {
            reject 550 5.1.1 "User does not exist"
        }
    }
}

# IMAP Listener (read emails from SnappyMail)
imap tcp://0.0.0.0:143 {
    tls off
    insecure_auth true
}

# SMTP Submission Listener (send emails from SnappyMail/clients)
submission tcp://0.0.0.0:587 {
    tls off
    insecure_auth true
    auth &local_authdb

    source $(local_domains) {
        check {
            authorize_sender {
                user_to_email identity
            }
        }
        destination postmaster $(local_domains) {
            deliver_to &local_mailboxes
        }
        default_destination {
            reject 550 5.7.1 "Relaying denied"
        }
    }
}
