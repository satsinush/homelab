# sftpgo/compose.yaml — WebDAV with local users (same accounts as Samba)
services:
  sftpgo:
    image: drakkan/sftpgo:v2.6.6
    container_name: sftpgo
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    command: ["sftpgo", "serve"]
    environment:
      TZ: ${TZ}
      SFTPGO_DATA_PROVIDER__CREATE_DEFAULT_ADMIN: "false"
      SFTPGO_SFTPD__BINDINGS__0__PORT: "0"
      SFTPGO_FTPD__BINDINGS__0__PORT: "0"
      # WebDAV has no session — cache authenticated users between PROPFINDs.
      SFTPGO_WEBDAVD__CACHE__USERS__EXPIRATION_TIME: "10"
      SFTPGO_WEBDAVD__CACHE__USERS__MAX_SIZE: "100"
      # Generated by sftpgo/setup.py from volumes/accounts/accounts.env
      SFTPGO_LOADDATA_FROM: /etc/sftpgo/loaddata.json
      SFTPGO_LOADDATA_MODE: "1"
    volumes:
      - ${PROJECT_ROOT}/sftpgo/volumes/config/sftpgo.json:/etc/sftpgo/sftpgo.json:ro
      - ${PROJECT_ROOT}/sftpgo/volumes/config/loaddata.json:/etc/sftpgo/loaddata.json:ro
      - ${PROJECT_ROOT}/storage:/srv/sftpgo/storage
      - ${PROJECT_ROOT}/sftpgo/volumes/data:/var/lib/sftpgo
    networks:
      - homelab-net
    labels:
      - "traefik.enable=true"

      # ── Web client: /files/web & /files/static → HTTPD (8081) ─────────────
      - "traefik.http.routers.dav-web.rule=Host(`${DAV_SERVICE_NAME}.${HOMELAB_HOSTNAME}`) && (PathPrefix(`/files/web`) || PathPrefix(`/files/static`))"
      - "traefik.http.routers.dav-web.entrypoints=websecure"
      - "traefik.http.routers.dav-web.tls=true"
      - "traefik.http.routers.dav-web.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.dav-web.priority=20"
      - "traefik.http.routers.dav-web.service=dav-web"
      - "traefik.http.services.dav-web.loadbalancer.server.port=8081"

      # ── WebDAV: /files → WebDAV (8080) ────────────────────────────────────
      # sftpgo.json sets webdavd.bindings[0].prefix=/files.
      - "traefik.http.routers.dav.rule=Host(`${DAV_SERVICE_NAME}.${HOMELAB_HOSTNAME}`) && PathPrefix(`/files`)"
      - "traefik.http.routers.dav.entrypoints=websecure"
      - "traefik.http.routers.dav.tls=true"
      - "traefik.http.routers.dav.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.dav.priority=10"
      - "traefik.http.routers.dav.service=dav"
      - "traefik.http.services.dav.loadbalancer.server.port=8080"

    healthcheck:
      test: ["CMD", "sftpgo", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  homelab-net:
    external: true
