services:
  radicale:
    image: docker.io/tomsquest/docker-radicale:latest
    container_name: radicale
    restart: unless-stopped
    volumes:
      - ${PROJECT_ROOT}/radicale/volumes/config:/config:ro
      - ${PROJECT_ROOT}/radicale/volumes/collections:/data/collections
    networks:
      - homelab-net
    labels:
      - "traefik.enable=true"

      # ── Main router: cal.domain → Radicale (serves CalDAV + CardDAV directly at /) ──
      - "traefik.http.routers.radicale.rule=Host(`${CAL_SERVICE_NAME}.${HOMELAB_HOSTNAME}`)"
      - "traefik.http.routers.radicale.entrypoints=websecure"
      - "traefik.http.routers.radicale.tls=true"
      - "traefik.http.routers.radicale.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.radicale.priority=10"
      - "traefik.http.routers.radicale.service=radicale"

      # ── .well-known auto-discovery → redirect to root ──────────────────────
      - "traefik.http.routers.radicale-wk.rule=Host(`${CAL_SERVICE_NAME}.${HOMELAB_HOSTNAME}`) && (PathPrefix(`/.well-known/caldav`) || PathPrefix(`/.well-known/carddav`))"
      - "traefik.http.routers.radicale-wk.entrypoints=websecure"
      - "traefik.http.routers.radicale-wk.tls=true"
      - "traefik.http.routers.radicale-wk.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.radicale-wk.priority=30"
      - "traefik.http.routers.radicale-wk.middlewares=radicale-wk-redirect"
      - "traefik.http.routers.radicale-wk.service=radicale"
      - "traefik.http.middlewares.radicale-wk-redirect.redirectregex.regex=^https?://([^/]+)/.well-known/(caldav|carddav)(.*)"
      - "traefik.http.middlewares.radicale-wk-redirect.redirectregex.replacement=https://$${1}/"
      - "traefik.http.middlewares.radicale-wk-redirect.redirectregex.permanent=true"

      # ── Shared backend ─────────────────────────────────────────────────────
      - "traefik.http.services.radicale.loadbalancer.server.port=5232"

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5232/.web/')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  homelab-net:
    external: true
