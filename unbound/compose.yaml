# unbound/compose.yaml
services:
  unbound:
    image: klutchell/unbound:latest
    container_name: unbound
    restart: unless-stopped
    volumes:
      - ${PROJECT_ROOT}/unbound/unbound.conf:/etc/unbound/custom.conf.d/unbound.conf:ro
      - ${PROJECT_ROOT}/unbound/cachedb.conf:/etc/unbound/custom.conf.d/cachedb.conf:ro
      - ${PROJECT_ROOT}/unbound/root.hints:/etc/unbound/root.hints:ro
    networks:
      - homelab-net
    depends_on:
      unbound-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "drill", "icann.org", "@127.0.0.1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  unbound-redis:
    image: redis:7-alpine
    container_name: unbound-redis
    restart: unless-stopped
    volumes:
      - ${PROJECT_ROOT}/unbound/volumes/redis:/data
    networks:
      - homelab-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      start_period: 30s

networks:
  homelab-net:
    external: true
