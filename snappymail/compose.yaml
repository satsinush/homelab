services:
  snappymail:
    image: djmaze/snappymail:latest
    container_name: snappymail
    restart: unless-stopped
    user: "${PUID}:${PGID}"
    environment:
      TZ: ${TZ}
    volumes:
      - ${PROJECT_ROOT}/snappymail/volumes/data:/var/lib/snappymail
    networks:
      - homelab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.snappymail.rule=Host(`${SNAPPYMAIL_SERVICE_NAME}.${HOMELAB_HOSTNAME}`)"
      - "traefik.http.routers.snappymail.entrypoints=websecure"
      - "traefik.http.routers.snappymail.tls=true"
      - "traefik.http.routers.snappymail.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.snappymail.service=snappymail"
      - "traefik.http.services.snappymail.loadbalancer.server.port=80"

networks:
  homelab-net:
    external: true
    name: homelab-net
