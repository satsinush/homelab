version: 1
metadata:
  name: "Homelab Bootstrap"
entries:
  # =================================================================
  # Predefined Roles
  # =================================================================
  - model: authentik_rbac.role
    identifiers:
      name: homelab-admin
    attrs:
      name: homelab-admin

  - model: authentik_rbac.role
    identifiers:
      name: dashboard-user
    attrs:
      name: dashboard-user

  - model: authentik_rbac.role
    identifiers:
      name: dashboard-devices-user
    attrs:
      name: dashboard-devices-user

  - model: authentik_rbac.role
    identifiers:
      name: dashboard-chat-user
    attrs:
      name: dashboard-chat-user

  - model: authentik_rbac.role
    identifiers:
      name: dashboard-wordgames-user
    attrs:
      name: dashboard-wordgames-user

  - model: authentik_rbac.role
    identifiers:
      name: dashboard-packages-user
    attrs:
      name: dashboard-packages-user

  - model: authentik_rbac.role
    identifiers:
      name: dashboard-settings-user
    attrs:
      name: dashboard-settings-user

  - model: authentik_rbac.role
    identifiers:
      name: vaultwarden-user
    attrs:
      name: vaultwarden-user

  - model: authentik_rbac.role
    identifiers:
      name: headscale-user
    attrs:
      name: headscale-user

  # =================================================================
  # Groups
  # =================================================================
  - model: authentik_core.group
    identifiers:
      name: homelab-admins
    attrs:
      name: homelab-admins
      is_superuser: true
      roles:
        - !Find [authentik_rbac.role, [name, homelab-admin]]

  - model: authentik_core.group
    identifiers:
      name: homelab-users
    attrs:
      name: homelab-users
      is_superuser: false
      roles:
        - !Find [authentik_rbac.role, [name, dashboard-user]]
        - !Find [authentik_rbac.role, [name, dashboard-devices-user]]
        - !Find [authentik_rbac.role, [name, dashboard-wordgames-user]]
        - !Find [authentik_rbac.role, [name, vaultwarden-user]]
        - !Find [authentik_rbac.role, [name, headscale-user]]

  # =================================================================
  # Admin User
  # =================================================================
  - model: authentik_core.user
    id: default-admin
    identifiers:
      username: !Env HOMELAB_USERNAME
    attrs:
      username: !Env HOMELAB_USERNAME
      name: !Env HOMELAB_USERNAME
      email: !Format ["%s@%s", !Env HOMELAB_USERNAME, !Env HOMELAB_HOSTNAME]
      is_active: true
      is_superuser: true
      password: !File /run/secrets/homelab_password
      groups:
        - !Find [authentik_core.group, [name, homelab-admins]]

  # =================================================================
  # Password Policies
  # =================================================================
  - model: authentik_policies_password.passwordpolicy
    id: password-policy-12-char
    identifiers:
      name: "12-char-min-policy"
    attrs:
      name: "12-char-min-policy"
      amount_digits: 0
      amount_uppercase: 0
      amount_lowercase: 0
      amount_symbols: 0
      length_min: 12
      error_message: "Password must be at least 12 characters long."

  # =================================================================
  # =================================================================
  # Custom Scope Mappings
  # =================================================================
  - model: authentik_providers_oauth2.scopemapping
    id: scope-groups
    identifiers:
      scope_name: groups
    attrs:
      name: "custom-scope-groups"
      scope_name: groups
      description: "SSO Groups and Roles"
      expression: |
        groups = [g.name for g in request.user.ak_groups.all()]
        roles = [r.name for r in request.user.all_roles()]
        return {
            "groups": groups,
            "roles": roles
        }

  - model: authentik_providers_oauth2.scopemapping
    id: scope-email
    identifiers:
      scope_name: email
    attrs:
      name: "custom-scope-email"
      scope_name: email
      description: "SSO Email"
      expression: |
        return {
            "email": request.user.email,
            "email_verified": True
        }

  # OIDC Providers & Applications
  # =================================================================

  # Vaultwarden
  - model: authentik_providers_oauth2.oauth2provider
    id: vaultwarden
    identifiers:
      name: vaultwarden
    attrs:
      name: vaultwarden
      client_id: vaultwarden
      client_secret: !File /run/secrets/vaultwarden_oidc_secret
      client_type: confidential
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - url: !Format ["https://%s.%s/identity/connect/oidc-signin", !Env VAULTWARDEN_SERVICE_NAME, !Env HOMELAB_HOSTNAME]
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !KeyOf scope-email
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf scope-groups

  - model: authentik_core.application
    identifiers:
      slug: vaultwarden
    attrs:
      name: Vaultwarden
      slug: vaultwarden
      provider: !KeyOf vaultwarden
      icon: icons/vaultwarden_logo.png

  # Headscale (Tailscale control plane — OIDC device enrollment)
  - model: authentik_providers_oauth2.oauth2provider
    id: headscale
    identifiers:
      name: headscale
    attrs:
      name: headscale
      client_id: headscale
      client_secret: !File /run/secrets/headscale_oidc_secret
      client_type: confidential
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      # Leave encryption_key unset — Headscale does not support JWE id_tokens.
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - url: !Format ["https://%s/oidc/callback", !Env HEADSCALE_WEB_HOSTNAME]
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !KeyOf scope-email
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf scope-groups

  - model: authentik_core.application
    identifiers:
      slug: headscale
    attrs:
      name: Headscale
      slug: headscale
      provider: !KeyOf headscale
      meta_launch_url: !Format ["https://%s", !Env HEADSCALE_WEB_HOSTNAME]
      meta_hide: true

  # Homelab Dashboard
  - model: authentik_providers_oauth2.oauth2provider
    id: homelab_dashboard
    identifiers:
      name: homelab_dashboard
    attrs:
      name: homelab_dashboard
      client_id: homelab_dashboard
      client_secret: !File /run/secrets/dashboard_oidc_secret
      client_type: confidential
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      # Unbind this app only — keeps the Authentik SSO session for other apps.
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, "authentik Self-signed Certificate"]]
      grant_types:
        - authorization_code
        - refresh_token
      redirect_uris:
        - url: !Format ["https://%s.%s/api/users/sso-callback", !Env DASHBOARD_SERVICE_NAME, !Env HOMELAB_HOSTNAME]
          matching_mode: strict
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
        - !KeyOf scope-email
        - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
        - !KeyOf scope-groups

  - model: authentik_core.application
    identifiers:
      slug: homelab-dashboard
    attrs:
      name: Homelab Dashboard
      slug: homelab-dashboard
      provider: !KeyOf homelab_dashboard
      meta_launch_url: !Format ["https://%s.%s", !Env DASHBOARD_SERVICE_NAME, !Env HOMELAB_HOSTNAME]
      icon: homelab-icon.svg

  # =================================================================
  # Proxy Providers for Traefik Forward-Auth
  # =================================================================

  # Pi-hole Proxy
  - model: authentik_providers_proxy.proxyprovider
    id: pihole-proxy
    identifiers:
      name: pihole-proxy
    attrs:
      name: pihole-proxy
      mode: forward_single
      external_host: !Format ["https://%s.%s", !Env PIHOLE_SERVICE_NAME, !Env HOMELAB_HOSTNAME]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    identifiers:
      slug: pihole-app
    attrs:
      name: Pi-hole
      slug: pihole-app
      provider: !KeyOf pihole-proxy
      icon: icons/pi_hole_logo.png

  # Gatus (public status page — no SSO / forward-auth)
  - model: authentik_core.application
    identifiers:
      slug: gatus-app
    attrs:
      name: Gatus
      slug: gatus-app
      meta_launch_url: !Format ["https://%s.%s", !Env GATUS_SERVICE_NAME, !Env HOMELAB_HOSTNAME]
      open_in_new_tab: true
      meta_description: Service health status dashboard (unauthenticated)
      icon: icons/gatus_logo.png

  # Dockhand Proxy
  - model: authentik_providers_proxy.proxyprovider
    id: dockhand-proxy
    identifiers:
      name: dockhand-proxy
    attrs:
      name: dockhand-proxy
      mode: forward_single
      external_host: !Format ["https://%s.%s", !Env DOCKHAND_SERVICE_NAME, !Env HOMELAB_HOSTNAME]
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-explicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]

  - model: authentik_core.application
    identifiers:
      slug: dockhand-app
    attrs:
      name: Dockhand
      slug: dockhand-app
      provider: !KeyOf dockhand-proxy
      icon: icons/dockhand_logo.png

  # Gotify (bookmark only — no SSO / forward-auth required)
  - model: authentik_core.application
    identifiers:
      slug: gotify-app
    attrs:
      name: Gotify
      slug: gotify-app
      meta_launch_url: !Format ["https://%s.%s", !Env GOTIFY_SERVICE_NAME, !Env HOMELAB_HOSTNAME]
      open_in_new_tab: true
      meta_description: Self-hosted push notification server
      icon: icons/gotify_logo.png


  # =================================================================
  # Access Policies (Bind Groups to Applications)
  # =================================================================
  # Pi-hole
  # Pi-hole
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, pihole-app]]
      group: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      order: 0

  # Dockhand
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, dockhand-app]]
      group: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      order: 0

  # Gotify (visible in library; service itself stays unauthenticated)
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, gotify-app]]
      group: !Find [authentik_core.group, [name, homelab-users]]
    attrs:
      order: 0

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, gotify-app]]
      group: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      order: 1

  # Vaultwarden
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, vaultwarden]]
      group: !Find [authentik_core.group, [name, homelab-users]]
    attrs:
      order: 0

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, vaultwarden]]
      group: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      order: 1

  # Headscale VPN enrollment
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, headscale]]
      group: !Find [authentik_core.group, [name, homelab-users]]
    attrs:
      order: 0

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, headscale]]
      group: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      order: 1

  # Homelab Dashboard
  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, homelab-dashboard]]
      group: !Find [authentik_core.group, [name, homelab-users]]
    attrs:
      order: 0

  - model: authentik_policies.policybinding
    identifiers:
      target: !Find [authentik_core.application, [slug, homelab-dashboard]]
      group: !Find [authentik_core.group, [name, homelab-admins]]
    attrs:
      order: 1

  # =================================================================
  # Outpost Association
  # =================================================================
  - model: authentik_outposts.outpost
    identifiers:
      name: "authentik Embedded Outpost"
    attrs:
      config:
        authentik_host: !Format ["https://%s.%s/", !Env AUTHENTIK_SERVICE_NAME, !Env HOMELAB_HOSTNAME]
      providers:
        - !Find [authentik_providers_proxy.proxyprovider, [name, pihole-proxy]]
        - !Find [authentik_providers_proxy.proxyprovider, [name, dockhand-proxy]]

  # Brand styling to match dark dashboard theme
  - model: authentik_brands.brand
    identifiers:
      default: true
    attrs:
      branding_title: "Homelab"
      default: true
      branding_logo: "homelab-icon.svg"
      branding_favicon: "homelab-icon.svg"
      branding_custom_css: |
        /* Custom CSS to match Homelab Dashboard Dark Theme */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        :root {
            --pf-global--FontFamily--sans-serif: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
            --pf-global--BackgroundColor--100: #0f172a !important;
            --pf-global--BackgroundColor--200: #1e293b !important;
            
            /* Primary brand/button colors */
            --pf-global--primary-color--100: #60a5fa !important;
            --pf-global--primary-color--200: #3b82f6 !important;
            --pf-global--link--Color: #60a5fa !important;
            --pf-global--link--Color--hover: #93c5fd !important;
            
            /* Text colors */
            --pf-global--Color--100: #f1f5f9 !important;
            --pf-global--Color--200: #cbd5e1 !important;
            
            /* Login container details */
            --pf-c-login__main--BackgroundColor: #1e293b !important;
            --pf-v5-c-login__main--BackgroundColor: #1e293b !important;
        }

        body, html {
            font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
            background-color: #0f172a !important;
            color: #f1f5f9 !important;
        }

        /* Background image/pattern - match the dark dashboard style */
        .pf-c-page, .pf-v5-c-page, .pf-c-login, .pf-v5-c-login {
            background-color: #0f172a !important;
            background-image: radial-gradient(circle at 10% 20%, rgba(96, 165, 250, 0.05) 0%, transparent 40%), 
                              radial-gradient(circle at 90% 80%, rgba(52, 211, 153, 0.03) 0%, transparent 40%) !important;
        }

        /* Login main box glassmorphism and styling */
        .pf-c-login__main, .pf-v5-c-login__main {
            background-color: #1e293b !important;
            border-radius: 12px !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 
                        0 8px 10px -6px rgba(0, 0, 0, 0.3) !important;
        }

        /* Inputs styling */
        .pf-c-form-control, .pf-v5-c-form-control {
            background-color: #0f172a !important;
            border-color: rgba(255, 255, 255, 0.1) !important;
            color: #f1f5f9 !important;
            border-radius: 6px !important;
        }

        .pf-c-form-control:focus, .pf-v5-c-form-control:focus {
            border-bottom-color: #60a5fa !important;
            --pf-c-form-control--Focus--border-bottom-color: #60a5fa !important;
        }

        /* Button styling */
        .pf-c-button.pf-m-primary, .pf-v5-c-button.pf-m-primary {
            background-color: #60a5fa !important;
            color: #0f172a !important;
            font-weight: 600 !important;
            border-radius: 8px !important;
            border: none !important;
            transition: background-color 0.2s ease-in-out !important;
        }

        .pf-c-button.pf-m-primary:hover, .pf-v5-c-button.pf-m-primary:hover {
            background-color: #3b82f6 !important;
            color: #ffffff !important;
        }

        /* Title text */
        .pf-c-title, .pf-v5-c-title, h1, h2 {
            color: #f1f5f9 !important;
        }

        /* Footer / helpers */
        .pf-c-login__footer-list-item-link, .pf-v5-c-login__footer-list-item-link {
            color: #cbd5e1 !important;
        }
