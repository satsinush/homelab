services:
  sogo-db:
    image: postgres:16-alpine
    container_name: sogo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sogo
      POSTGRES_USER: sogo
      POSTGRES_PASSWORD: sogopassword
    volumes:
      - ${PROJECT_ROOT}/sogo/volumes/db:/var/lib/postgresql/data
    networks:
      - homelab-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sogo"]
      interval: 10s
      timeout: 5s
      retries: 5

  sogo:
    image: mailcow/sogo:1.127
    container_name: sogo
    restart: unless-stopped
    depends_on:
      sogo-db:
        condition: service_healthy
    volumes:
      - ${PROJECT_ROOT}/sogo/volumes/config/sogo.conf:/etc/sogo/sogo.conf:ro
    networks:
      - homelab-net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sogo.rule=Host(`${SOGO_SERVICE_NAME}.${HOMELAB_HOSTNAME}`)"
      - "traefik.http.routers.sogo.entrypoints=websecure"
      - "traefik.http.routers.sogo.tls=true"
      - "traefik.http.routers.sogo.tls.certresolver=${TRAEFIK_CERT_RESOLVER}"
      - "traefik.http.routers.sogo.service=sogo"
      - "traefik.http.services.sogo.loadbalancer.server.port=20000"

networks:
  homelab-net:
    external: true
    name: homelab-net
